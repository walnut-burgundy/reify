name: coupled substitution

on:
  pull_request:
  push:

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reject partial shark or fish rewrites
        run: sh tests/check_coupled_substitution.sh
      - name: Verify the source-level coupled-substitution contract
        uses: isomorphisms/ai-ci@04eee139d051ce181f11a59414881f811d524d3a
        with:
          suite: config/ai-ci.suite.tsv
          root: .
